http{
    include    mime.types;
    default type application/octet-stream;

    server {
        log_format detallado '$time_iso8601 | $remote_addr | $request_method $request_uri | $status | $body_bytes_sent bytes | $request_time s';

        listen        80;
        server_tokens off;
        root          /usr/share/nginx/html;
        index         index.html;
    }

    error_page 404 /404.html;
    access_log /var/log/nginx/access.log detallado;
    access_log /var/log/nginx/access.log combined;


}